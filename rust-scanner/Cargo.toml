[package]
name = "dng-subset"
version = "0.1.0"
description = "Read-only DNG encoded-block subset comparison and native preservation workers"
license = "MIT"
repository = "https://github.com/firstpair/dng-compare"
edition = "2024"
rust-version = "1.99"

[features]
default = []
turso-probe = ["dep:turso", "dep:pollster"]
# In-process exiftool-rs engine for `metadata-extract --engine exiftool-rs`.
# Links GPL-3.0-or-later code; see exiftool-ffi/THIRD-PARTY.md.
exiftool-rs = ["dep:dng-exiftool-ffi"]

[[bin]]
name = "turso-probe"
path = "src/bin/turso-probe.rs"
required-features = ["turso-probe"]

[dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
turso = { version = "=0.8.2", default-features = false, optional = true }
pollster = { version = "0.4", optional = true }
flate2 = "1.1.10"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
dng-exiftool-ffi = { path = "exiftool-ffi", optional = true }

[workspace]
members = [".", "exiftool-ffi"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
