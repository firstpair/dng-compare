[package]
name = "dng-exiftool-ffi"
version = "0.1.0"
description = "Optional in-process exiftool-rs metadata engine with a C ABI for the OCaml worker"
license = "MIT"
repository = "https://github.com/firstpair/dng-compare"
edition = "2024"
rust-version = "1.99"

[lib]
name = "dng_exiftool_ffi"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
# GPL-3.0-or-later. Binaries that link this engine carry its license terms; see THIRD-PARTY.md.
# exiftool-rs 0.12.0 from crates.io, the first releases to carry the dng-compare parity work
# (-struct, multi-family -G labels, -n JSON, numeric pseudo tags; upstream PR #20, in 0.11.0).
# Pinned exactly: a new release changes the engine identity, so bump it deliberately.
exiftool-rs = { version = "=0.12.0", default-features = false }
serde_json = "1"

[dev-dependencies]
serde = "1"
